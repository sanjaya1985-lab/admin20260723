<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RMV Print Portal - Auto Fill Forms</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    body { font-family: 'Inter', sans-serif; background: #525659; margin: 0; padding: 0; color: #333; }
    
    /* Sticky Top Wrapper for Freeze Panel */
    .sticky-wrapper {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: #525659;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    
    .header { background: #121212; color: #fff; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #c62828; }
    .tabs { display: flex; background: #fff; border-bottom: 1px solid #ddd; padding: 0 20px; }
    .tab { padding: 15px 20px; cursor: pointer; font-weight: bold; color: #666; border-bottom: 3px solid transparent; }
    .tab.active { color: #c62828; border-bottom-color: #c62828; }
    .content-section { padding: 30px; display: none; }
    .content-section.active { display: block; }
    
    .form-box { background: #fff; padding: 25px; border-radius: 8px; max-width: 800px; margin: 0 auto; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-weight: bold; font-size: 14px; margin-bottom: 5px; color: #444; }
    .form-control { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; outline: none; box-sizing: border-box; font-family: 'Courier New', Courier, monospace; font-weight: bold; font-size: 15px; text-transform: uppercase;}
    .btn { padding: 12px 20px; background: #0d6efd; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; width: 100%; }
    .btn-print { background: #198754; width: auto; margin-bottom: 20px; display: block; margin-left: auto; margin-right: auto; font-size: 16px; padding: 15px 30px; }
    
    /* A4 PRINT PAGE STYLES */
    .a4-preview-container { display: flex; flex-direction: column; gap: 30px; align-items: center; overflow-y: auto; padding-bottom: 50px; }
    
    .a4-page { 
      background-color: white; 
      width: 210mm; 
      height: 297mm; 
      box-shadow: 0 5px 15px rgba(0,0,0,0.5); 
      box-sizing: border-box; 
      position: relative; 
      background-size: 100% 100%; 
      background-repeat: no-repeat;
      page-break-after: always; 
    }

    .p-text {
      position: absolute;
      font-size: 15px;
      font-family: 'Courier New', Courier, monospace; 
      font-weight: bold;
      color: #000;
      white-space: nowrap;
    }

    @page { size: A4 portrait; margin: 0; } 
    @media print {
      body * { visibility: hidden; }
      .sticky-wrapper { position: static; box-shadow: none; }
      #sec-print, #sec-print * { visibility: visible; }
      #sec-print { position: absolute; left: 0; top: 0; width: 100%; margin: 0; padding: 0; background: white; }
      .a4-preview-container { padding: 0; gap: 0; display: block; }
      .btn-print, .tabs, .header, .no-print { display: none !important; }
      .a4-page { 
        width: 210mm; height: 297mm; box-shadow: none; margin: 0; padding: 0; 
        -webkit-print-color-adjust: exact !important; 
        print-color-adjust: exact !important;
      }
      /* Prevent blank pages by stopping page-break on the last visible element */
      .a4-page.no-break {
        page-break-after: auto !important;
      }
    }
  </style>
</head>

  <script>
    function switchTab(tabId) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
      document.getElementById('tab-' + tabId).classList.add('active');
      document.getElementById('sec-' + tabId).classList.add('active');
    }

    // Standard 35/35 Split for MTA 6
    function applyTextToLines(el1Id, el2Id, el3Id, text, defaultSpacing) {
      let el1 = document.getElementById(el1Id);
      let el2 = document.getElementById(el2Id);
      let el3 = document.getElementById(el3Id);
      if (!el1 || !el2 || !el3) return;

      if(text.length <= 35) {
        el1.innerText = text; el2.innerText = ""; el3.innerText = "";
        el1.style.letterSpacing = defaultSpacing;
      } else if(text.length <= 70) {
        el1.innerText = text.substring(0, 35); el2.innerText = text.substring(35, 70); el3.innerText = "";
        el1.style.letterSpacing = defaultSpacing; el2.style.letterSpacing = defaultSpacing;
      } else {
        el1.innerText = text.substring(0, 35); el2.innerText = text.substring(35, 70); el3.innerText = text.substring(70, text.length);
        el1.style.letterSpacing = defaultSpacing; el2.style.letterSpacing = defaultSpacing;
      }
    }

    // Custom Split for MTA 8 
    function applyCustomTextTo4Lines(el1Id, el2Id, el3Id, el4Id, text, limit1, limit2, limit3, defaultSpacing) {
      let el1 = document.getElementById(el1Id);
      let el2 = document.getElementById(el2Id);
      let el3 = document.getElementById(el3Id);
      let el4 = document.getElementById(el4Id);
      if (!el1 || !el2 || !el3 || !el4) return;

      let l1 = limit1;
      let l2 = limit1 + limit2;
      let l3 = limit1 + limit2 + limit3;

      if(text.length <= l1) {
        el1.innerText = text; el2.innerText = ""; el3.innerText = ""; el4.innerText = "";
      } else if(text.length <= l2) {
        el1.innerText = text.substring(0, l1);
        el2.innerText = text.substring(l1, text.length);
        el3.innerText = ""; el4.innerText = "";
      } else if(text.length <= l3) {
        el1.innerText = text.substring(0, l1);
        el2.innerText = text.substring(l1, l2);
        el3.innerText = text.substring(l2, text.length);
        el4.innerText = "";
      } else {
        el1.innerText = text.substring(0, l1);
        el2.innerText = text.substring(l1, l2);
        el3.innerText = text.substring(l2, l3);
        el4.innerText = text.substring(l3, text.length); 
      }
      
      el1.style.letterSpacing = defaultSpacing;
      el2.style.letterSpacing = defaultSpacing;
      el3.style.letterSpacing = defaultSpacing;
    }

    // Modified MTA 3 Text Overflow Handler supporting up to 3 lines
    function applyMta3Text(baseId, text, limit1, limit2) {
      let mainEl = document.getElementById(baseId);
      let ovEl = document.getElementById(baseId + "_ov");
      let ov2El = document.getElementById(baseId + "_ov2");
      
      if(!mainEl || !ovEl) return;
      
      if(text.length <= limit1) {
        mainEl.innerText = text;
        ovEl.innerText = "";
        if(ov2El) ov2El.innerText = "";
      } else {
        mainEl.innerText = text.substring(0, limit1);
        let remaining = text.substring(limit1, text.length);
        
        if(limit2 && remaining.length > limit2) {
          ovEl.innerText = remaining.substring(0, limit2);
          if(ov2El) {
            ov2El.innerText = remaining.substring(limit2, remaining.length);
          }
        } else {
          ovEl.innerText = remaining;
          if(ov2El) ov2El.innerText = "";
        }
      }
    }

    function saveDataAndPreparePrint() {
      // Get Values
      const dDD = document.getElementById('i_dateDD').value;
      const dMM = document.getElementById('i_dateMM').value;
      const dYYYY = document.getElementById('i_dateYYYY').value;
      const vProv = document.getElementById('i_vehProv').value;
      const vLetters = document.getElementById('i_vehLetters').value;
      const vNums = document.getElementById('i_vehNum').value;
      const oldName = document.getElementById('i_oldName').value;
      const oldAddress = document.getElementById('i_oldAddress').value;
      const oldId = document.getElementById('i_oldId').value;
      const newName = document.getElementById('i_newName').value;
      const newAddress = document.getElementById('i_newAddress').value;
      const newId = document.getElementById('i_newId').value;
      
      const financeName = document.getElementById('i_financeName').value;
      const financeAddress = document.getElementById('i_financeAddress').value;

      const postalCode = document.getElementById('i_postalCode').value;
      const mobileNo = document.getElementById('i_mobileNo').value;
      const divSec = document.getElementById('i_divSec').value;
      const district = document.getElementById('i_district').value;
      const provinceLoc = document.getElementById('i_provinceLoc').value;
      const collectOffice = document.getElementById('i_collectOffice').value;

      // --- Fill MTA 6 ---
      document.getElementById('p1_date_dd').innerText = dDD;
      document.getElementById('p1_date_mm').innerText = dMM;
      document.getElementById('p1_date_yyyy').innerText = dYYYY;
      document.getElementById('p1_veh_prov').innerText = vProv;
      document.getElementById('p1_veh_letters').innerText = vLetters;
      document.getElementById('p1_veh_nums').innerText = vNums;

      applyTextToLines('p1_oldName', 'p1_oldName2', 'p1_oldName3', oldName, '10px');
      applyTextToLines('p1_oldAddress', 'p1_oldAddress2', 'p1_oldAddress3', oldAddress, '10px');
      applyTextToLines('p1_newName', 'p1_newName2', 'p1_newName3', newName, '10px');
      applyTextToLines('p1_newAddress', 'p1_newAddress2', 'p1_newAddress3', newAddress, '10px');
      
      document.getElementById('p1_oldId').innerText = oldId.replace(/\s/g, ''); 
      document.getElementById('p1_newId').innerText = newId.replace(/\s/g, ''); 
      document.getElementById('p1_bottom_vehNo').innerText = vProv + "-" + vLetters + "-" + vNums;

      // --- Fill MTA 8 ---
      document.getElementById('p2_veh_prov').innerText = vProv;
      document.getElementById('p2_veh_letters').innerText = vLetters;
      document.getElementById('p2_veh_nums').innerText = vNums;

      applyTextToLines('p2_oldName', 'p2_oldName2', 'p2_oldName3', oldName, '12px'); 
      if(oldName.length > 27) {
        document.getElementById('p2_oldName').innerText = oldName.substring(0, 27);
        if (oldName.length > 62) {
            document.getElementById('p2_oldName2').innerText = oldName.substring(27, 62);
            document.getElementById('p2_oldName3').innerText = oldName.substring(62, oldName.length);
        } else {
            document.getElementById('p2_oldName2').innerText = oldName.substring(27, oldName.length);
            document.getElementById('p2_oldName3').innerText = "";
        }
      }

      applyCustomTextTo4Lines('p2_newName', 'p2_newName2', 'p2_newName3', 'p2_newName4', newName, 33, 35, 35, '12px');
      applyCustomTextTo4Lines('p2_newAddress', 'p2_newAddress2', 'p2_newAddress3', 'p2_newAddress4', newAddress, 31, 35, 35, '12px');

      document.getElementById('p2_newId').innerText = newId.replace(/\s/g, ''); 
      document.getElementById('p2_postalCode').innerText = postalCode;
      document.getElementById('p2_mobileNo').innerText = mobileNo;
      document.getElementById('p2_divSec').innerText = divSec;
      document.getElementById('p2_district').innerText = district;
      document.getElementById('p2_provinceLoc').innerText = provinceLoc;
      document.getElementById('p2_date_d').innerText = dDD;
      document.getElementById('p2_date_m').innerText = dMM;
      document.getElementById('p2_date_y').innerText = dYYYY;
      document.getElementById('p2_collectOffice').innerText = collectOffice;

      // --- Manage Page Breaks & Display for MTA 3 ---
      if(financeName.trim() !== "") {
        document.getElementById('page_mta3_front').style.display = "block";
        document.getElementById('page_mta3_back').style.display = "block";
        
        // Remove page break from MTA 3 Back (last visible page)
        document.getElementById('page_mta8').classList.remove('no-break');
        document.getElementById('page_mta3_back').classList.add('no-break');
        
        // Front Page Splitting based on Excel Limits
        applyMta3Text('p3f_financeAddress1', financeAddress, 98);
        applyMta3Text('p3f_financeName1', financeName, 100);
        applyMta3Text('p3f_newAddress1', newAddress, 70);
        
        // --- UPDATED: p3f_newName1 splits at 25 and 50 characters, remaining to 3rd line ---
        applyMta3Text('p3f_newName1', newName, 25, 50);
        
        applyMta3Text('p3f_newAddress2', newAddress, 90);
        applyMta3Text('p3f_newName2', newName, 105);

        // Back Page Splitting based on Excel Limits
        applyMta3Text('p3b_financeAddress1', financeAddress, 55, 27);
        applyMta3Text('p3b_financeName1', financeName, 23);

      } else {
        document.getElementById('page_mta3_front').style.display = "none";
        document.getElementById('page_mta3_back').style.display = "none";
        
        // Remove page break from MTA 8 (since it's now the last visible page)
        document.getElementById('page_mta8').classList.add('no-break');
      }

      switchTab('print');
    }
  </script>

</body>
</html>
